<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>로그인</title>
        <style>
        .submit-btn {
            width: 20%;
            padding: 12px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background-color: #c7cdd6;
            cursor: not-allowed;
            transition: background-color 0.2s ease;
        }

        .submit-btn.active {
            background-color: #b8dcff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>로그인</h1>

        <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>

        <form th:action="@{/auth}" method="post" id="loginForm">
            <div>
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="이메일을 입력해줘" required />
            </div>

            <div>
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력해줘" required />
            </div>

            <button type="submit" class="submit-btn" id="loginBtn" disabled>로그인</button>
        </form>

        <p>
            <a th:href="@{/auth/signup}">회원가입 하러 가기</a>
        </p>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const requiredInputs = loginForm.querySelectorAll("input[required]");

        function updateLoginButton() {
            const allFilled = Array.from(requiredInputs).every(input => input.value.trim() !== "");

            if (allFilled) {
                loginBtn.disabled = false;
                loginBtn.classList.add("active");
            } else {
                loginBtn.disabled = true;
                loginBtn.classList.remove("active");
            }
        }

        requiredInputs.forEach(input => {
            input.addEventListener("input", updateLoginButton);
        });

        updateLoginButton();
    </script>
</body>
</html>
